name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Build web app
        run: |
          npm ci
          npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/DalalSetu.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: DalalSetu-apk
          path: DalalSetu.apk

      - name: Publish APK to the "latest" release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: DalalSetu (latest build)
          body: Debug APK built from ${{ github.sha }}. Install on Android by allowing installs from unknown sources.
          files: DalalSetu.apk
          prerelease: true
          make_latest: true
